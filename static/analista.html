            padding: 16px;

            letter-spacing: 0.5px;

        th {

        td {

            color: #10B981;

        /* --- Vista Técnica --- */
        .json-view {

            padding: 20px;

        .obs-list {

        .loading {

            color: rgba(255,255,255,0.5);
        }

        .loading::after {

            height: 20px;
            border: 3px solid rgba(124,58,237,0.15);

            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        .segundo-solicitante-section {

            border-top: 2px dashed rgba(124,58,237,0.15);
        }
    </style>

<script>
var SMLMV_VIGENTE = 1750905;   // mismo valor que SMLMV en app/config.py
var UVT_VIGENTE = 52374;

function calcularSolidaridad(ingresoMensual) {
    var smlmvs = SMLMV_VIGENTE > 0 ? ingresoMensual / SMLMV_VIGENTE : 0;
    if (smlmvs < 4) return 0;
    var tarifa = 0;
    if (smlmvs <= 16) tarifa = 0.01;
    else if (smlmvs <= 17) tarifa = 0.012;
    else if (smlmvs <= 18) tarifa = 0.014;
    else if (smlmvs <= 19) tarifa = 0.016;
    else if (smlmvs <= 20) tarifa = 0.018;
    else tarifa = 0.02;
    return Math.round(ingresoMensual * tarifa);
}

function calcularRetencionFuente(ingresoMensual) {
    var brutAnual = ingresoMensual * 12;
    var tope25 = SMLMV_VIGENTE * 25 * 12;
    var baseAportes = Math.min(brutAnual, tope25);
    var incr = baseAportes * 0.08;
    var neto = brutAnual - incr;
    var rentaExenta25 = neto * 0.25;
    var limiteConjunto40 = neto * 0.40;
    var ajusteLimite = Math.min(rentaExenta25, limiteConjunto40);
    var ingresoGravado = neto - ajusteLimite;
    var mensualUVT = (UVT_VIGENTE > 0 ? ingresoGravado / UVT_VIGENTE : 0) / 12;

    var DIAN = [
        { min: 0, rate: 0, base: 0, add: 0 },
        { min: 95, rate: 0.19, base: 95, add: 0 },
        { min: 150, rate: 0.28, base: 150, add: 10 },
        { min: 360, rate: 0.33, base: 360, add: 69 },
        { min: 640, rate: 0.35, base: 640, add: 162 },
        { min: 945, rate: 0.37, base: 945, add: 268 },
        { min: 2300, rate: 0.39, base: 2300, add: 770 }
    ];
    var b = DIAN[0];
    for (var i = 1; i < DIAN.length; i++) {
        if (mensualUVT > DIAN[i].min) b = DIAN[i];
    }
    var impUVT = (mensualUVT - b.base) * b.rate + b.add;
    if (impUVT < 0) impUVT = 0;
    return Math.round(impUVT * UVT_VIGENTE);
}

function formatCOP(val) {
    return '$' + Math.round(val).toLocaleString('es-CO');
}

function parsearMonto(val) {
    if (!val) return 0;
    var limpio = val.replace(/[^0-9]/g, '');
    return parseInt(limpio, 10) || 0;
}

function mesNombre(m) {
    const meses = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return meses[m] || m;
}

function cargarParentesco() {
    var carpetaRaw = sessionStorage.getItem('morada_carpeta');
    if (!carpetaRaw) return;
    var carpeta = JSON.parse(carpetaRaw);
    if (carpeta.secundario && carpeta.secundario.parentesco) {
        document.getElementById('parentescoAnalista').value = carpeta.secundario.parentesco;
    }
}

async function evaluar() {
    var centralesRaw = sessionStorage.getItem('morada_centrales');
    if (!centralesRaw) { alert('No hay datos de centrales. Vuelva a Solicitud.'); return; }

    var centrales = JSON.parse(centralesRaw);
    var experianPrincipal = centrales.principal;

    var carpetaRaw = sessionStorage.getItem('morada_carpeta');
    var carpeta = carpetaRaw ? JSON.parse(carpetaRaw) : {};

    const payload = {
        solicitante_principal: experianPrincipal,
        score_principal: parseFloat(document.getElementById('scorePrincipalAnalista').value) || 600
    };

    if (centrales.secundario) {
        payload.solicitante_secundario = centrales.secundario;
        payload.parentesco = carpeta.secundario ? carpeta.secundario.parentesco || 'conyuge' : 'conyuge';
        payload.score_secundario = parseFloat(document.getElementById('scoreSegundoAnalista').value) || 600;
    }

    var haySeg = !!centrales.secundario;

    const resultsDiv = document.getElementById('results');
    resultsDiv.classList.add('visible');
    document.getElementById('summaryPrincipal').innerHTML = '<div class="loading">Evaluando</div>';

    try {
        const resp = await fetch('/filtro/evaluar-ingreso', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (!resp.ok) {
            const err = await resp.json();
            document.getElementById('summaryPrincipal').innerHTML =
                '<div class="error-msg">Error: ' + JSON.stringify(err.detail || err) + '</div>';
            return;
        }

        const data = await resp.json();
        renderAnalista(data, payload);
    } catch(e) {
        document.getElementById('summaryPrincipal').innerHTML =
            '<div class="error-msg">Error de conexión: ' + e.message + '</div>';
    }
}

function calcularAntiguedad(datosExperian) {
    if (!datosExperian || !datosExperian.data) {
        return { cumple: false, detalle: 'Sin datos', tipo: 'desconocido' };
    }
    var d = datosExperian.data;
    var cedula = (d.numero_identificacion_persona_natural || '').replace(/[.\s]/g, '');
    var aportantes = d.aportantes || [];
    if (aportantes.length === 0) {
        return { cumple: false, detalle: 'Sin historial de aportantes', tipo: 'desconocido' };
    }

    var ultimo = aportantes[aportantes.length - 1];
    var nitUltimo = (ultimo.numero_identificacion_aportante || '').replace(/[.\s]/g, '');
    var pagosUltimo = ultimo.resultado_pagos || ultimo.resultados_pago || [];

    if (cedula && nitUltimo && cedula === nitUltimo) {
        return { cumple: false, tipo: 'independiente', detalle: 'CC igual a NIT empleador — Se considera independiente' };
    }

    var descCotizante = (ultimo.descripcion_cotizante_persona_natural || '').toLowerCase();
    var esPensionado = descCotizante.indexOf('pension') !== -1;

    var totalMeses = 0;
    for (var a = 0; a < aportantes.length; a++) {
        var pagos = aportantes[a].resultado_pagos || aportantes[a].resultados_pago || [];
        for (var p = 0; p < pagos.length; p++) {
            if (pagos[p].realizo_pago) totalMeses++;
        }
    }

    var pagosOrd = pagosUltimo.slice().sort(function(x, y) {
        var ya = x.ano_periodo_validado || x.anio;
        var ym = x.mes_periodo_validado || x.mes;
        var za = y.ano_periodo_validado || y.anio;
        var zm = y.mes_periodo_validado || y.mes;
        return (ya * 100 + ym) - (za * 100 + zm);
    });
    var consecutivos = 0;
    var rachaActual = 0;
    for (var i = 0; i < pagosOrd.length; i++) {
        if (pagosOrd[i].realizo_pago) {
            rachaActual++;
            if (rachaActual > consecutivos) consecutivos = rachaActual;
        } else {
            rachaActual = 0;
        }
    }

    if (esPensionado) {
        return {
            cumple: totalMeses >= 1, tipo: 'pensionado',
            meses_totales: totalMeses, meses_consecutivos: consecutivos,
            detalle: 'Pensionado — ' + totalMeses + ' mes(es) con pago (mín. 1)'
        };
    }

    return {
        cumple: totalMeses >= 6 && consecutivos >= 2, tipo: 'empleado',
        meses_totales: totalMeses, meses_consecutivos: consecutivos,
        detalle: totalMeses + ' meses totales (mín. 6) — ' + consecutivos + ' consecutivos en última entidad (mín. 2)'
    };
}

function renderDetalleSolicitante(detalle, datosExperian) {
    const nombre = datosExperian?.data
        ? `${datosExperian.data.primer_nombre_persona_natural || ''} ${datosExperian.data.primer_apellido_persona_natural || ''}`.trim()
        : '';
    const cedula = datosExperian?.data?.numero_identificacion_persona_natural || '';
    const ingreso = detalle.ingreso_calculado;
    const esPositivo = ingreso > 0;
    const antiguedad = calcularAntiguedad(datosExperian);
    const solidaridad = calcularSolidaridad(ingreso);
    const retencion = calcularRetencionFuente(ingreso);
    const ingresoNeto = ingreso - solidaridad - retencion;
    const smlmvs = SMLMV_VIGENTE > 0 ? (ingreso / SMLMV_VIGENTE) : 0;

    let html = '';

    // Metrics
    html += '<div class="summary-grid">';
    html += `
        <div class="metric-card ${esPositivo ? 'success' : 'danger'}">
            <div class="metric-label">Ingreso Calculado</div>
            <div class="metric-value">${formatCOP(ingreso)}</div>
            <div class="metric-detail">Actividad principal</div>
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(124,58,237,0.2);">
                <div class="metric-label">Retenci&oacute;n Fondo Solidaridad</div>
                <div class="metric-value" style="font-size:18px; color:${solidaridad > 0 ? '#EF4444' : 'rgba(255,255,255,0.4)'};">${solidaridad > 0 ? '-' + formatCOP(solidaridad) : '$0'}</div>
                <div class="metric-detail">${smlmvs >= 4 ? smlmvs.toFixed(2) + ' SMLMV &rarr; tarifa ' + (solidaridad > 0 ? ((solidaridad / ingreso) * 100).toFixed(1) : '0') + '%' : smlmvs.toFixed(2) + ' SMLMV &lt; 4 &rarr; No aplica'}</div>
            </div>
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(124,58,237,0.2);">
                <div class="metric-label">Retenci&oacute;n en la Fuente</div>
                <div class="metric-value" style="font-size:18px; color:${retencion > 0 ? '#EF4444' : 'rgba(255,255,255,0.4)'};">${retencion > 0 ? '-' + formatCOP(retencion) : '$0'}</div>
            </div>
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(124,58,237,0.2);">
                <div class="metric-label">Ingreso Neto antes de Gastos B&aacute;sicos y Cuotas Centrales</div>
                <div class="metric-value" style="font-size:22px;">${formatCOP(ingresoNeto)}</div>
            </div>
        </div>
        <div class="metric-card ${antiguedad.cumple ? 'success' : 'danger'}">
            <div class="metric-label">Antig&uuml;edad Laboral (8.1.4)</div>
            <div class="metric-value" style="font-size:18px">${antiguedad.cumple ? 'Cumple' : 'No Cumple'}</div>
            <div class="metric-detail" style="margin-top:8px">${antiguedad.detalle}</div>
        </div>`;

    if (nombre) {
        html += `
        <div class="metric-card">
            <div class="metric-label">Solicitante</div>
            <div class="metric-value" style="font-size:18px">${nombre}</div>
            <div class="metric-detail">C.C. ${cedula}</div>
        </div>`;
    }

    html += `
        <div class="metric-card">
            <div class="metric-label">Decisi&oacute;n Aplicada</div>
            <div class="metric-value" style="font-size:14px; line-height:1.4">${detalle.decision_aplicada}</div>
        </div>`;

    html += '</div>';

    // Vector table
    if (detalle.vector_consolidado && detalle.vector_consolidado.length > 0) {
        html += '<div class="section-title">Historial de Pagos (Vector Consolidado)</div>';
        html += '<table><thead><tr><th>Periodo</th><th>Pago</th><th>Ingreso</th></tr></thead><tbody>';
        for (const v of detalle.vector_consolidado) {
            const badge = v.realizo_pago
                ? '<span class="badge badge-si">SI</span>'
                : '<span class="badge badge-no">NO</span>';
            html += `<tr>
                <td>${mesNombre(v.mes)} ${v.anio}</td>
                <td>${badge}</td>
                <td>${formatCOP(v.ingresos)}</td>
            </tr>`;
        }
        html += '</tbody></table>';
    }

    // Observations
    if (detalle.observaciones && detalle.observaciones.length > 0) {
        html += '<div class="section-title">Observaciones</div>';
        html += '<ul class="obs-list">';
        for (const o of detalle.observaciones) {
            html += `<li>${o}</li>`;
        }
        html += '</ul>';
    }

    return html;
}

function renderAnalista(data, payload) {
    var haySeg = !!data.solicitante_secundario;

    var antPrincipal = calcularAntiguedad(payload.solicitante_principal);
    var antSecundario = haySeg ? calcularAntiguedad(payload.solicitante_secundario) : null;

    var ingPrincipal = data.solicitante_principal.ingreso_calculado;
    var netoPrincipal = ingPrincipal - calcularSolidaridad(ingPrincipal) - calcularRetencionFuente(ingPrincipal);
    var ingSecundario = haySeg ? data.solicitante_secundario.ingreso_calculado : 0;
    var netoSecundario = haySeg ? ingSecundario - calcularSolidaridad(ingSecundario) - calcularRetencionFuente(ingSecundario) : 0;

    var ingresoTotal = 0;
    var notas = [];
    if (antPrincipal.cumple) { ingresoTotal += netoPrincipal; }
    else { notas.push('Principal: no cumple antigüedad (8.1.4) — ingreso excluido'); }
    if (haySeg) {
        if (antSecundario.cumple) { ingresoTotal += netoSecundario; }
        else { notas.push('Secundario: no cumple antigüedad (8.1.4) — ingreso excluido'); }
    }

    // Resultado del análisis para la hoja de Capacidad de Pago: ingreso neto
    // (sin retención en la fuente ni fondo de solidaridad) por solicitante,
    // en cero si no cumple antigüedad. Los arriendos se suman allá, tomados
    // del Análisis de Arriendos.
    function resumenIngreso(datosExperian, ingreso, neto, antiguedad) {
        return {
            cedula: String((datosExperian.data || {}).numero_identificacion_persona_natural || ''),
            ingreso_calculado: ingreso,
            solidaridad: calcularSolidaridad(ingreso),
            retencion_fuente: calcularRetencionFuente(ingreso),
            ingreso_neto: neto,
            cumple_antiguedad: !!antiguedad.cumple,
            ingreso_neto_aceptado: antiguedad.cumple ? neto : 0
        };
    }
    sessionStorage.setItem('morada_ingresos', JSON.stringify({
        principal: resumenIngreso(payload.solicitante_principal, ingPrincipal, netoPrincipal, antPrincipal),
        secundario: haySeg ? resumenIngreso(payload.solicitante_secundario, ingSecundario, netoSecundario, antSecundario) : null,
        ingreso_total: ingresoTotal
    }));
    sessionStorage.removeItem('morada_capacidad');

    var detalleTotal = notas.length > 0
        ? notas.join('<br>') : (haySeg ? 'Suma de ambos solicitantes: ingreso calculado menos retenci&oacute;n en la fuente y fondo de solidaridad' : 'Ingreso calculado menos retenci&oacute;n en la fuente y fondo de solidaridad');
    var colorTotal = ingresoTotal > 0 ? 'success' : 'danger';

    var totalHtml = `
        <div class="summary-grid">
            <div class="metric-card ${colorTotal}">
                <div class="metric-label">Ingreso Neto Total antes de Gastos B&aacute;sicos y Cuotas Centrales</div>
                <div class="metric-value">${formatCOP(ingresoTotal)}</div>
                <div class="metric-detail">${detalleTotal}</div>
            </div>
        </div>`;
    document.getElementById('resumenTotal').innerHTML = totalHtml;
    document.getElementById('cardResumenTotal').style.display = 'block';

    // Principal
    document.getElementById('summaryPrincipal').innerHTML =
        renderDetalleSolicitante(data.solicitante_principal, payload.solicitante_principal);

    // Secondary
    var secSection = document.getElementById('secondarySection');
    if (haySeg) {
        secSection.style.display = 'block';
        document.getElementById('summarySecundario').innerHTML =
            renderDetalleSolicitante(data.solicitante_secundario, payload.solicitante_secundario);
    } else {
        secSection.style.display = 'none';
    }

    // Segundo solicitante + observaciones al final
    var footHtml = '';
    if (haySeg && data.segundo_solicitante_aceptado !== null && data.segundo_solicitante_aceptado !== undefined) {
        var aceptado = data.segundo_solicitante_aceptado;
        footHtml += '<div class="card"><div class="summary-grid">';
        footHtml += '<div class="metric-card ' + (aceptado ? 'success' : 'danger') + '">';
        footHtml += '<div class="metric-label">Segundo Solicitante</div>';
        footHtml += '<div class="metric-value" style="font-size:18px">' + (aceptado ? 'Aceptado' : 'Rechazado') + '</div>';
        footHtml += '</div></div></div>';
    }

    var obsGenerales = (data.observaciones_generales || []).filter(function(o) {
        return o.toLowerCase().indexOf('segundo solicitante aceptado') === -1;
    });
    if (obsGenerales.length > 0) {
        footHtml += '<div class="card"><div class="section-title">Observaciones Generales</div>';
        footHtml += '<ul class="obs-list">';
        for (var i = 0; i < obsGenerales.length; i++) {
            footHtml += '<li>' + obsGenerales[i] + '</li>';
        }
        footHtml += '</ul></div>';
    }
    document.getElementById('obsGenerales').innerHTML = footHtml;
}

window.addEventListener('load', function() {
    cargarParentesco();

    if (sessionStorage.getItem('morada_autoevaluar') === 'true') {
        sessionStorage.removeItem('morada_autoevaluar');
        setTimeout(evaluar, 300);
    } else if (sessionStorage.getItem('morada_centrales')) {
        evaluar();
    }
});
</script>
