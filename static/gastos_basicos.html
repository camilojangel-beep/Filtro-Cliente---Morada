<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morada Capital &mdash; Gastos B&aacute;sicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0D0B1A;
            color: #E2E0EA;
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: #0D0B1A;
            color: white;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(124,58,237,0.2);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo { width: 30px; height: 30px; }
        .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
        }
        .header-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        .nav {
            background: #0D0B1A;
            padding: 0 32px;
            display: flex;
            gap: 0;
            border-bottom: 1px solid rgba(124,58,237,0.1);
        }
        .nav a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav a:hover { color: white; }
        .nav a.active { color: white; border-bottom-color: #7C3AED; }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .card {
            background: #1A1832;
            border-radius: 16px;
            border: 1px solid rgba(124,58,237,0.15);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            padding: 32px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 4px;
        }

        .card .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 24px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.4);
            font-size: 15px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-brand">
        <svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L20 10l12 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M12 19v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V19" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M17 32v-7a3 3 0 0 1 6 0v7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="brand-name">Morada</span>
    </div>
    <span class="header-subtitle">Gastos B&aacute;sicos</span>
</div>

<div class="nav">
    <a href="/muestra">Muestra</a>
    <a href="/">Solicitud</a>
    <a href="/analista">An&aacute;lisis de Ingresos</a>
    <a href="/analisis-ctl">An&aacute;lisis Arriendos</a>
    <a href="/gastos-basicos" class="active">Gastos B&aacute;sicos</a>
    <a href="/carpeta">Carpeta</a>
</div>

<div class="container">
    <div class="card">
        <h2>Gastos B&aacute;sicos</h2>
        <div class="subtitle">An&aacute;lisis de gastos b&aacute;sicos del solicitante</div>
        <div class="empty-state">
            <div class="icon">&#128203;</div>
            P&aacute;gina en construcci&oacute;n
        </div>
    </div>
</div>

</body>
</html>
