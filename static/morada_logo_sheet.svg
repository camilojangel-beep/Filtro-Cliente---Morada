<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <style>
      .title { font: 700 48px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; fill: #241742; }
      .subtitle { font: 500 22px "Trebuchet MS", sans-serif; fill: #6d6680; }
      .section { font: 700 28px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; fill: #3f247d; }
      .label { font: 600 22px "Trebuchet MS", sans-serif; fill: #4a4657; }
      .small { font: 500 18px "Trebuchet MS", sans-serif; fill: #817a94; }
      .morada { font: 700 96px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; fill: #4a2a8b; }
      .capital { font: 600 42px "Trebuchet MS", sans-serif; letter-spacing: 15px; fill: #8d38ff; }
      .letters-main { font: 700 66px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; fill: #4a2a8b; }
      .letters-sub { font: 600 40px "Trebuchet MS", sans-serif; letter-spacing: 10px; fill: #8d38ff; }
      .chip { font: 600 18px "Trebuchet MS", sans-serif; fill: #4a2a8b; }
      .stroke-dark { stroke: #4a2a8b; }
      .stroke-light { stroke: #8d38ff; }
      .panel { fill: #ffffff; stroke: #ece8f5; stroke-width: 2; rx: 28; }
      .accent { fill: #f6f1ff; }
    </style>
  </defs>

  <rect width="1800" height="1400" fill="#f7f5fb"/>
  <rect x="40" y="40" width="1720" height="1320" rx="36" fill="#ffffff"/>

  <text x="110" y="130" class="title">Morada - reconstruccion preliminar del logo</text>
  <text x="110" y="172" class="subtitle">Lamina comparativa para validar isotipo, wordmark y letras antes de entregarlo a Claude.</text>

  <rect x="110" y="235" width="500" height="640" class="panel"/>
  <rect x="650" y="235" width="500" height="640" class="panel"/>
  <rect x="1190" y="235" width="500" height="640" class="panel"/>

  <text x="150" y="292" class="section">Version A</text>
  <text x="690" y="292" class="section">Version B</text>
  <text x="1230" y="292" class="section">Version C</text>

  <text x="150" y="328" class="small">Trazo mas cercano a la silueta del ejemplo</text>
  <text x="690" y="328" class="small">Techo un poco mas abierto y centro mas ligero</text>
  <text x="1230" y="328" class="small">M interna mas marcada y bases mas redondas</text>

  <!-- Version A -->
  <g transform="translate(220 360)">
    <path d="M150 18 L226 92 C236 102 242 116 242 130 V184 C242 220 214 246 182 246 C161 246 145 239 134 216 V110 C134 104 129 100 124 100 C120 100 117 102 114 105 L76 143 L38 105 C35 102 32 100 28 100 C22 100 18 104 18 110 V184 C18 220 46 246 78 246 C99 246 115 239 126 216 L150 190 L174 216 C185 239 201 246 222 246 C254 246 282 220 282 184 V130 C282 116 276 102 266 92 Z"
      fill="none" stroke="#4a2a8b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 143 L108 175" fill="none" stroke="#4a2a8b" stroke-width="14" stroke-linecap="round"/>
    <path d="M224 143 L192 175" fill="none" stroke="#4a2a8b" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="208" y="720" class="morada">Morada</text>
  <text x="290" y="775" class="capital">Capital</text>
  <rect x="158" y="807" width="130" height="34" rx="17" class="accent"/>
  <text x="182" y="830" class="chip">principal</text>

  <!-- Version B -->
  <g transform="translate(760 360)">
    <path d="M150 18 L232 98 C241 108 246 121 246 135 V184 C246 218 220 244 190 244 C168 244 149 236 138 214 V118 C138 111 133 106 127 106 C122 106 118 109 115 112 L78 149 L44 115 C41 111 37 109 32 109 C26 109 22 114 22 120 V184 C22 218 48 244 78 244 C101 244 120 236 131 214 L150 195 L169 214 C180 236 199 244 222 244 C252 244 278 218 278 184 V135 C278 121 273 108 264 98 Z"
      fill="none" stroke="#4a2a8b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 149 L111 180" fill="none" stroke="#4a2a8b" stroke-width="13" stroke-linecap="round"/>
    <path d="M222 149 L190 180" fill="none" stroke="#4a2a8b" stroke-width="13" stroke-linecap="round"/>
  </g>
  <text x="748" y="720" class="morada">Morada</text>
  <text x="830" y="775" class="capital">Capital</text>
  <rect x="698" y="807" width="122" height="34" rx="17" class="accent"/>
  <text x="725" y="830" class="chip">abierta</text>

  <!-- Version C -->
  <g transform="translate(1300 360)">
    <path d="M150 20 L228 96 C239 106 246 119 246 135 V186 C246 221 219 248 186 248 C164 248 146 241 134 220 V116 C134 109 128 104 122 104 C118 104 114 106 111 110 L77 145 L42 110 C39 106 35 104 31 104 C25 104 20 109 20 116 V186 C20 221 47 248 80 248 C101 248 119 241 131 220 L150 198 L169 220 C181 241 199 248 220 248 C253 248 280 221 280 186 V135 C280 119 273 106 262 96 Z"
      fill="none" stroke="#4a2a8b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M77 145 L108 178" fill="none" stroke="#4a2a8b" stroke-width="15" stroke-linecap="round"/>
    <path d="M223 145 L192 178" fill="none" stroke="#4a2a8b" stroke-width="15" stroke-linecap="round"/>
  </g>
  <text x="1288" y="720" class="morada">Morada</text>
  <text x="1370" y="775" class="capital">Capital</text>
  <rect x="1238" y="807" width="118" height="34" rx="17" class="accent"/>
  <text x="1264" y="830" class="chip">gruesa</text>

  <rect x="110" y="930" width="1580" height="330" class="panel"/>
  <text x="150" y="992" class="section">Letras sugeridas para el logo</text>
  <text x="150" y="1028" class="subtitle">Referencia del brand board: palabra principal &quot;Morada&quot;, subtitulo &quot;Capital&quot; y tipografia objetivo &quot;Rubik Medium&quot;.</text>

  <text x="150" y="1105" class="label">Palabra principal</text>
  <text x="150" y="1180" class="letters-main">M o r a d a</text>

  <text x="880" y="1105" class="label">Subtitulo</text>
  <text x="880" y="1180" class="letters-sub">C a p i t a l</text>

  <text x="150" y="1232" class="small">Color morado base aproximado: #4A2A8B</text>
  <text x="880" y="1232" class="small">Morado acento aproximado: #8D38FF</text>

  <circle cx="1590" cy="1090" r="76" fill="#4a2a8b"/>
  <g transform="translate(1528 1030) scale(0.45)">
    <path d="M150 18 L226 92 C236 102 242 116 242 130 V184 C242 220 214 246 182 246 C161 246 145 239 134 216 V110 C134 104 129 100 124 100 C120 100 117 102 114 105 L76 143 L38 105 C35 102 32 100 28 100 C22 100 18 104 18 110 V184 C18 220 46 246 78 246 C99 246 115 239 126 216 L150 190 L174 216 C185 239 201 246 222 246 C254 246 282 220 282 184 V130 C282 116 276 102 266 92 Z"
      fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 143 L108 175" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M224 143 L192 175" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  </g>

  <text x="150" y="1320" class="small">Objetivo de esta lamina: escoger la forma correcta del isotipo antes de sacar una version final mas fiel para entregar.</text>
</svg>
